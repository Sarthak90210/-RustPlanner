[package]
name = "mp-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
roxmltree = "0.20"

[dependencies]
mavlink = { version = "0.21", default-features = false, features = ["std", "dialect-ardupilotmega", "dialect-common", "format-generated-code", "mav2-message-extensions"] }
log = "0.4"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
roxmltree = "0.20"
regex = "1"
lzma-rs = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
num-traits = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rust_decimal = { version = "1.40", default-features = false, features = ["std"] }
indexmap = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
serialport = { version = "4.10", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_LibraryLoader", "Win32_Globalization"] }
