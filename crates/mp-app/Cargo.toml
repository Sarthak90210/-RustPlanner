[package]
name = "mp-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "missionplanner"
path = "src/main.rs"

[dependencies]
mp-core = { path = "../mp-core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "persistence"] }
egui = "0.37"
egui_extras = "0.37"
log = "0.4"
parking_lot = "0.12"
crossbeam-channel = "0.5"
ureq = "3"
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
libloading = "0.8"
mp-plugin = { path = "../mp-plugin" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
roxmltree = "0.20"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
env_logger = "0.11"
rfd = "0.17"
gilrs = "0.11"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Globalization"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }

[package.metadata.android]
package = "org.ardupilot.missionplanner.rs"
apk_name = "MissionPlannerRS"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.application]
label = "Mission Planner"
