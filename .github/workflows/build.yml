name: build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libgtk-3-dev libwayland-dev
      - run: cargo test --workspace
      - name: Packaging regression checks
        run: python -m unittest discover -s scripts -p "test_ios_packaging.py" -v
      - run: cargo build -p mp-app --release
      - uses: actions/upload-artifact@v4
        with:
          name: missionplanner-${{ matrix.os }}
          path: |
            target/release/missionplanner
            target/release/missionplanner.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
      - run: cargo install cargo-apk
      - run: cargo apk build -p mp-app --lib --target aarch64-linux-android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
      - uses: actions/upload-artifact@v4
        with:
          name: missionplanner-android-debug
          path: target/debug/apk/*.apk

  ios:
    strategy:
      fail-fast: false
      matrix:
        kind: [device, simulator]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ios-${{ matrix.kind }}
      - name: Build iOS app bundle
        run: python3 scripts/build_ios.py --target ${{ matrix.kind }} --release
      - name: Install, launch and capture in iOS Simulator
        if: matrix.kind == 'simulator'
        run: python3 scripts/smoke_ios_simulator.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missionplanner-ios-${{ matrix.kind }}
          path: |
            target/ios/**/*.zip
            target/ios/**/build.json
            target/ios/smoke/*
          if-no-files-found: error
