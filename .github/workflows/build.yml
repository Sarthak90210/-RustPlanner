name: build

on:
  push:
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libgtk-3-dev libwayland-dev
      - run: cargo test --workspace
      - run: cargo build -p mp-app --release
      - uses: actions/upload-artifact@v4
        with:
          name: missionplanner-${{ matrix.os }}
          path: |
            target/release/missionplanner
            target/release/missionplanner.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
      - run: cargo install cargo-apk
      - run: cargo apk build -p mp-app --lib --release --target aarch64-linux-android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
      - uses: actions/upload-artifact@v4
        with:
          name: missionplanner-android
          path: target/release/apk/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: cargo build -p mp-app --lib --release --target aarch64-apple-ios
